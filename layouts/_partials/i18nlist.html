{{ if .IsTranslated }}
<style>
  .lang-switcher {
    display: inline-flex;
    align-items: center;
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .lang-item {
    display: inline-flex;
    align-items: center;
    margin-right: 1.25rem;
  }
  .lang-flag-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 3px;
    overflow: hidden;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.25);
    transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease, opacity 0.2s ease;
    opacity: 0.85;
    line-height: 0;
  }
  .lang-flag-link:hover {
    transform: scale(1.12);
    opacity: 1;
    box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.75);
  }
  .lang-flag-svg {
    display: block;
    width: 22px;
    height: 15px;
  }
</style>
<ul class="lang-switcher">
  {{ range .Translations }}
    <li class="lang-item">
      <a class="lang-flag-link" href="{{ .RelPermalink }}" title="{{ if eq .Lang "fr" }}Passer en Français{{ else }}Switch to English{{ end }}" aria-label="{{ if eq .Lang "fr" }}Français{{ else }}English{{ end }}">
        {{ if eq .Lang "fr" }}
          <svg class="lang-flag-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3 2" aria-hidden="true">
            <rect width="1" height="2" fill="#002395"/>
            <rect width="1" height="2" x="1" fill="#FFFFFF"/>
            <rect width="1" height="2" x="2" fill="#ED2939"/>
          </svg>
        {{ else if eq .Lang "en" }}
          <svg class="lang-flag-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 30" aria-hidden="true">
            <clipPath id="s-flag"><path d="M0,0 v30 h60 v-30 z"/></clipPath>
            <clipPath id="t-flag"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath>
            <g clip-path="url(#s-flag)">
              <path d="M0,0 v30 h60 v-30 z" fill="#012169"/>
              <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
              <path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#t-flag)" stroke="#C8102E" stroke-width="4"/>
              <path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/>
              <path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/>
            </g>
          </svg>
        {{ else }}
          {{ .Lang }}
        {{ end }}
      </a>
    </li>
  {{ end }}
</ul>
{{ end }}
